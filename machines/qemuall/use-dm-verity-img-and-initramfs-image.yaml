header:
  version: 2
local_conf_header:
  machine-use-dm-verity-img-and-initramfs-image: |
    INITRD += "${DEPLOY_DIR_IMAGE}/${INITRAMFS_IMAGE}${IMAGE_MACHINE_SUFFIX}.${@d.getVar('INITRAMFS_FSTYPES').split()[0]}"
    IMAGE_EFI_BOOT_FILES += "${S}/initrd/initrd;initrd"
